name: Build ARM64 Debian Package

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Kodu Çek
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: QEMU ve ARM64 Derleme Ortamını Hazırla
        uses: docker/setup-qemu-action@v3

      - name: Docker İçinde ARM64 Olarak Derle
        run: |
          docker run --rm -v ${{ github.workspace }}:/workspace -w /workspace arm64v8/ubuntu:24.04 /bin/bash -c "
            set -e
            apt-get update
            DEBIAN_FRONTEND=noninteractive apt-get install -y \
              build-essential cmake git curl \
              libasound2-dev libjack-jackd2-dev libmicrohttpd-dev \
              libmagic-dev libcrypto++-dev libjsoncpp-dev libarchive-dev \
              libboost-all-dev libicu-dev lv2-dev \
              nodejs npm

            # 1. React Web Arayüzünü Derle
            if [ -d 'react' ]; then
              cd react
              npm install
              npm run build
              cd ..
            fi

            # 2. C++ Arka Plan Motorunu Derle
            mkdir -p build && cd build
            cmake -DCMAKE_BUILD_TYPE=Release ..
            make -j\$(nproc)
            cpack -G DEB || true
          "

      - name: Hazır Paketleri Topla
        run: |
          mkdir -p output
          find build/ -name "*.deb" -exec cp {} output/ \; || true
          find . -name "*.deb" -exec cp {} output/ \; || true

      - name: Paketi İndirilebilir Yap (Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: pipedal-stage-arm64-deb
          path: output/*.deb
          if-no-files-found: warn
