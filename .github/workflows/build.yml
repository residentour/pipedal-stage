name: arm64 build
on: workflow_dispatch

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Bağımlılıkları Kur
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build build-essential nodejs npm \
            liblilv-dev libboost-dev libsystemd-dev catch2 libasound2-dev uuid-dev authbind \
            libavahi-client-dev libnm-dev libicu-dev libsdbus-c++-dev libzip-dev \
            google-perftools libgoogle-perftools-dev libpipewire-0.3-dev libbz2-dev \
            libssl-dev librsvg2-dev
          chmod +x ./react-config ./makePackage.sh 2>/dev/null || true
          ./react-config

      - name: Derle
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -G Ninja && cmake --build build

      - name: Debian Paketi Oluştur
        run: ./makePackage.sh

      - name: Paketi İndirilebilir Yap
        uses: actions/upload-artifact@v4
        with:
          name: pipedal-stage-arm64
          path: "**/*.deb"
