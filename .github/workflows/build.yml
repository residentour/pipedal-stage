name: Build ARM64 Debian Package

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Kodu İndir
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Node.js Kur (Web Arayüzü İçin)
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: ARM64 Çapraz Derleme Araçlarını Kur
        run: |
          sudo dpkg --add-architecture arm64
          sudo apt-get update
          sudo apt-get install -y \
            crossbuild-essential-arm64 \
            cmake git \
            libasound2-dev:arm64 \
            libjack-jackd2-dev:arm64 \
            libicu-dev:arm64 \
            lv2-dev:arm64

      - name: 1. React Web Arayüzünü Derle
        run: |
          if [ -d "react" ]; then
            cd react
            npm install
            npm run build
            cd ..
          fi

      - name: 2. C++ Arka Planını ARM64 Olarak Derle
        run: |
          mkdir -p build && cd build
          cmake -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_SYSTEM_NAME=Linux \
                -DCMAKE_SYSTEM_PROCESSOR=aarch64 \
                -DCMAKE_C_COMPILER=aarch64-linux-gnu-gcc \
                -DCMAKE_CXX_COMPILER=aarch64-linux-gnu-g++ \
                ..
          make -j$(nproc)
          cpack -G DEB || true

      - name: Paketleri Topla
        run: |
          mkdir -p output
          find build/ -name "*.deb" -exec cp {} output/ \; 2>/dev/null || true
          find . -name "*.deb" -exec cp {} output/ \; 2>/dev/null || true
          ls -la output/

      - name: Paketi İndirilebilir Yap
        uses: actions/upload-artifact@v4
        with:
          name: pipedal-stage-arm64-deb
          path: output/*.deb
